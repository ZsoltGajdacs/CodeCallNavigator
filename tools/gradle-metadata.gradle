// This public JDK-only helper is shared with Maven; no Gradle implementation is packaged.
initscript {
    def observerJar = System.getProperty('codecallnavigator.observerJar')
    if (!observerJar) { throw new GradleException('codecallnavigator.observerJar is required') }
    dependencies { classpath files(observerJar) }
}

import codecallnavigator.maven.CompilerJournal
import org.gradle.api.execution.TaskExecutionListener
import org.gradle.api.tasks.TaskState
import org.gradle.api.tasks.compile.JavaCompile
// Build-tool metadata only. This init script performs no Java parsing or call resolution.
import groovy.json.JsonOutput
import org.gradle.api.tasks.testing.Test
import org.gradle.jvm.tasks.Jar

def taskSourceInputs = { first ->
    def files = new LinkedHashSet()
    def visited = new HashSet()
    def visit
    visit = { task ->
        if (visited.add(task.path)) {
            def outputRoot = task.project.layout.buildDirectory.get().asFile.toPath()
            task.inputs.files.files.findAll {
                it.isFile() && !it.name.endsWith('.jar') && !it.name.endsWith('.class') && !it.toPath().startsWith(outputRoot)
            }.each {
                files.add(it.canonicalPath)
                if (it.absolutePath != it.canonicalPath) { files.add(it.absolutePath) }
            }
            task.taskDependencies.getDependencies(task).each { visit(it) }
        }
    }
    visit(first)
    files.toList()
}

// Classpath entries produced by this build are observed after compilation, not
// as authored inputs: Gradle may replace an output symlink while compiling.
def requiredAliases = { sources, generatedRoots, ownedOutputs ->
    def externalClasspath = sources.compileClasspath.files.findAll { input ->
        !ownedOutputs.any { output ->
            input.toPath().startsWith(output.toPath()) ||
                input.canonicalFile.toPath().startsWith(output.canonicalFile.toPath())
        }
    }
    (sources.allJava.srcDirs + generatedRoots + externalClasspath).findAll {
        it.absolutePath != it.canonicalPath
    }.collect { it.absolutePath }
}

def settingsDirectory
gradle.settingsEvaluated { settings -> settingsDirectory = settings.settingsDir }

def configurationInputs = { projects ->
    def files = projects.collectMany { project -> [project.buildFile, new File(project.projectDir, 'gradle.properties')] }
    files.addAll(['settings.gradle', 'settings.gradle.kts', 'gradle.properties', 'gradlew', 'gradlew.bat',
                  'gradle/wrapper/gradle-wrapper.properties', 'gradle/wrapper/gradle-wrapper.jar'].collect {
        new File(settingsDirectory, it)
    })
    files.collectMany { file -> [file.absolutePath, file.canonicalPath] }.unique().sort()
}

gradle.projectsEvaluated {
    def root = gradle.rootProject
    def javaProjects = root.allprojects.findAll { it.extensions.findByName('sourceSets') != null }
    def observationFile = System.getProperty('codecallnavigator.observation.file')
    if (observationFile) {
        def journal = new CompilerJournal(new File(observationFile).toPath(), System.getProperty('codecallnavigator.observation.attempt'))
        def selections = javaProjects.collectMany { project ->
            project.sourceSets.collect { sources ->
                [task: project.tasks.named(sources.compileJavaTaskName).get(), sources: sources]
            }
        }.collectEntries { entry -> [(entry.task.path): entry.sources] }
        def compilerInputs = { JavaCompile task, sources ->
            def generated = task.options.generatedSourceOutputDirectory.orNull?.asFile
            new CompilerJournal.Inputs(sources.allJava.srcDirs.collect { it.absolutePath },
                task.classpath.files.collect { it.absolutePath },
                [task.destinationDirectory.get().asFile.absolutePath],
                generated ? [generated.absolutePath] : [])
        }
        // Task boundaries preserve native UP-TO-DATE/cache/no-source behavior.
        // A task's own doFirst mutation is an observed in-task consistency change;
        // we never reorder actions or claim to certify individual javac reads.
        gradle.taskGraph.addTaskExecutionListener(new TaskExecutionListener() {
            void beforeExecute(Task task) {
                if (!(task instanceof JavaCompile)) { return }
                def sources = selections[task.path]
                if (!sources) { throw new GradleException("Unowned JavaCompile task: ${task.path}") }
                def inputs = compilerInputs(task, sources)
                def owner = new CompilerJournal.Owner(task.project.projectDir.absolutePath, sources.name, task.path)
                if (!task.includes.isEmpty() || !task.excludes.isEmpty()) {
                    journal.unsupported(owner, inputs, "Custom JavaCompile source filters are unsupported")
                } else {
                    journal.before(owner, inputs)
                    journal.requireSourceSelection(owner, task.source.files.findAll { it.name.endsWith('.java') }
                        .collect { it.absolutePath })
                }
            }
            void afterExecute(Task task, TaskState state) {
                if (!(task instanceof JavaCompile)) { return }
                def sources = selections[task.path]
                def owner = new CompilerJournal.Owner(task.project.projectDir.absolutePath, sources.name, task.path)
                if (state.failure) { journal.failed(owner); return }
                def outcome = state.noSource ? CompilerJournal.Outcome.NO_SOURCE :
                    state.skipMessage == 'FROM-CACHE' ? CompilerJournal.Outcome.FROM_CACHE :
                    state.upToDate ? CompilerJournal.Outcome.UP_TO_DATE :
                    state.skipped ? CompilerJournal.Outcome.UNSUPPORTED : CompilerJournal.Outcome.SUCCESS
                journal.after(owner, compilerInputs(task, sources), outcome)
            }
        })
        gradle.buildFinished { result ->
            if (!result.failure) { journal.finish() }
        }
    }
    root.tasks.register('codecallnavigatorCompileSources') {
        def compileTasks = javaProjects.collectMany { project ->
            project.sourceSets.collect { sources -> project.tasks.named(sources.compileJavaTaskName) }
        }
        dependsOn(compileTasks)
    }
    def compileSources = root.tasks.named('codecallnavigatorCompileSources')
    root.tasks.register('codecallnavigatorCompileAndExport') {
        dependsOn(compileSources)
        finalizedBy('codecallnavigatorExportMetadata')
    }
    root.tasks.register('codecallnavigatorExportMetadata') {
        mustRunAfter(compileSources)
        doLast {
            def destination = root.findProperty('codecallnavigatorMetadataFile')
            if (!destination) { throw new GradleException('codecallnavigatorMetadataFile is required') }
            def ownedOutputs = javaProjects.collectMany { project ->
                project.sourceSets.collectMany { sources -> sources.output.classesDirs.files as List }
            }
            def entries = javaProjects.collectMany { project ->
                def testClassDirs = project.tasks.withType(Test).collectMany {
                    it.testClassesDirs.files.collect { directory -> directory.canonicalPath }
                }.toSet()
                project.sourceSets.collect { sources ->
                    def compile = project.tasks.findByName(sources.compileJavaTaskName)
                    def generated = compile?.options?.generatedSourceOutputDirectory?.orNull?.asFile
                    def generatedRoots = sources.allJava.srcDirs.findAll {
                        it.toPath().startsWith(project.layout.buildDirectory.get().asFile.toPath())
                    }
                    if (generated) { generatedRoots.add(generated) }
                    def testOwned = sources.name in ['test', 'testFixtures'] || sources.output.classesDirs.files.any {
                        testClassDirs.contains(it.canonicalPath)
                    }
                    [project: project.path, projectDir: project.projectDir.canonicalPath,
                     sourceSet: sources.name, isTest: testOwned, inputPolicy: "scoped_v1",
                     compileClasspath: sources.compileClasspath.files.collect { it.canonicalPath },
                     classpathAliases: project.tasks.withType(Jar).findAll { archive ->
                         def classes = archive.source.files.findAll { it.name.endsWith('.class') }
                         !classes.isEmpty() && classes.every { file -> sources.output.classesDirs.files.any { directory ->
                             file.toPath().startsWith(directory.toPath())
                         } }
                     }.collect { it.archiveFile.get().asFile.canonicalPath },
                     sourceRoots: sources.allJava.srcDirs.collect { it.canonicalPath },
                     generatedRoots: generatedRoots.collect { it.canonicalPath }.unique(),
                     buildInputs: ((compile ? taskSourceInputs(compile) : []) +
                         requiredAliases(sources, generatedRoots, ownedOutputs)).unique(),
                     // Keep the evaluated spelling so refresh policy can detect output aliases.
                     rawClassDirs: sources.output.classesDirs.files.collect { it.absolutePath },
                     classDirs: sources.output.classesDirs.files.collect { it.canonicalPath }]
                }
            }
            def outputs = (javaProjects.collect { it.layout.buildDirectory.get().asFile.canonicalPath } +
                ownedOutputs.collect { it.canonicalPath }).unique().sort()
            def metadata = [compileObservationVersion: 1,
                modules: javaProjects.collect { it.projectDir.canonicalPath }.unique().sort(),
                sourceSets: entries, buildInputs: entries.collectMany { it.buildInputs }.unique().sort(),
                outputRoots: outputs, configurationInputs: configurationInputs(root.allprojects)]
            new File(destination.toString()).setText(JsonOutput.prettyPrint(JsonOutput.toJson(metadata)), 'UTF-8')
        }
    }
}
