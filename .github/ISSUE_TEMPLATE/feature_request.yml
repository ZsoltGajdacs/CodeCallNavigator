name: Feature request
description: Describe a problem and the behavior you would like CodeCallNavigator to offer.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before requesting a feature. Requests do not imply acceptance or a commitment to implement them.
        This personal project has no guaranteed response, support or implementation schedule. Outside patches are not accepted.
        Reports are public: remove credentials, private source, personal information and identifying paths from text and attachments.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Explain what you are trying to do and what currently gets in the way.
    validations:
      required: true
  - type: textarea
    id: desired_behavior
    attributes:
      label: Proposed behavior
      description: Describe the result you would like and how it would help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)
      description: Mention existing workarounds or other approaches you considered.
  - type: textarea
    id: context
    attributes:
      label: Examples or additional context (optional)
      description: Include relevant language, framework, platform or sanitized screenshots. Share only material you have permission to publish.
