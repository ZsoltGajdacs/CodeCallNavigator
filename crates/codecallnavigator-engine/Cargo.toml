[package]
name = "codecallnavigator-engine"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
authors = ["Zsolt Gajdacs"]
repository = "https://github.com/ZsoltGajdacs/CodeCallNavigator"

[dependencies]
codecallnavigator-core = { path = "../codecallnavigator-core" }
anyhow = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
blake3 = "1"
shlex = "=2.0.1"
libc = "0.2"
tempfile = "3"
