[package]
name = "codecallnavigator-core"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
authors = ["Zsolt Gajdacs"]
repository = "https://github.com/ZsoltGajdacs/CodeCallNavigator"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
petgraph = "0.8"
blake3 = "1"
tempfile = "3"
serde_yaml = "0.9"
globset = "0.4"
regex = "1"
roxmltree = "=0.21.2"
