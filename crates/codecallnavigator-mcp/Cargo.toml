[package]
name = "codecallnavigator-mcp"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/ZsoltGajdacs/CodeCallNavigator"
description = "Independent stdio MCP adapter for the CodeCallNavigator CLI"

[dependencies]
anyhow = "1"
rmcp = { version = "=3.6.0", default-features = false, features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "time", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
