[workspace]
members = ["crates/codegraph-core", "crates/codegraph-engine"]
exclude = ["vendor/rune"]
resolver = "3"

[package]
name = "codegraph"
version = "0.1.0"
edition = "2024"
default-run = "codegraph"

[dependencies]
codegraph-core = { path = "crates/codegraph-core" }
codegraph-engine = { path = "crates/codegraph-engine" }
anyhow = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
petgraph = "0.8"
blake3 = "1"
shlex = "=2.0.1"
rune = { path = "vendor/rune/crates/rune", features = ["native-file-dialog"] }
rune-kit = { path = "vendor/rune/crates/rune-kit" }
libc = "0.2"
tempfile = "3"
serde_yaml = "0.9"
globset = "0.4"
regex = "1"
wgpu = { version = "=30.0.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.2.2", features = ["NSEvent"] }

[profile.release]
debug = 0

