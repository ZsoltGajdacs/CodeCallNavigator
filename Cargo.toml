[workspace]
members = ["crates/codecallnavigator-core", "crates/codecallnavigator-engine", "crates/codecallnavigator-mcp"]
exclude = ["vendor/rune"]
resolver = "3"

[package]
name = "codecallnavigator"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
authors = ["Zsolt Gajdacs"]
repository = "https://github.com/ZsoltGajdacs/CodeCallNavigator"
default-run = "codecallnavigator"

[dependencies]
codecallnavigator-core = { path = "crates/codecallnavigator-core" }
anyhow = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
petgraph = "0.8"
blake3 = "1"
shlex = "=2.0.1"
rune = { path = "vendor/rune/crates/rune", features = ["native-file-dialog", "tooling"] }
rune-kit = { path = "vendor/rune/crates/rune-kit" }
libc = "0.2"
tempfile = "3"
serde_yaml = "0.9"
globset = "0.4"
regex = "1"
wgpu = { version = "=30.0.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.2.2", features = ["NSEvent"] }

[profile.release]
debug = 0

# Rune's upstream patches must be selected by the consuming workspace.
[patch.crates-io]
wgpu-hal = { path = "vendor/rune/vendor/wgpu-hal" }
winit = { path = "vendor/rune/vendor/winit" }
parley_engine = { path = "vendor/rune/vendor/parley_engine" }
accesskit_windows = { path = "vendor/rune/vendor/accesskit_windows" }


[dev-dependencies]
codecallnavigator-engine = { path = "crates/codecallnavigator-engine" }
