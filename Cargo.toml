[package]
name = "codegraph"
version = "0.1.0"
edition = "2024"
default-run = "codegraph"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
petgraph = "0.8"
blake3 = "1"
rune = { path = "vendor/rune/crates/rune", features = ["native-file-dialog"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
debug = 0
